version: '3.8'

services:
  backend:
    build: .
    container_name: antigravity_backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://king:kingdom_auth_key@postgres:5432/antigravity_db
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - NEO4J_URL=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=kingdom_auth_key
      - OPENAI_API_KEY=${OPENAI_API_KEY:-mock-key}
      - KINGDOM_ENVIRONMENT=development
    depends_on:
      - postgres
      - redis
      - qdrant
      - neo4j
    networks:
      - antigravity_net

  postgres:
    image: postgres:16-alpine
    container_name: antigravity_postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=antigravity_db
      - POSTGRES_USER=king
      - POSTGRES_PASSWORD=kingdom_auth_key
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - antigravity_net

  redis:
    image: redis:7-alpine
    container_name: antigravity_redis
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - antigravity_net

  qdrant:
    image: qdrant/qdrant:v1.8.4
    container_name: antigravity_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - antigravity_net

  neo4j:
    image: neo4j:5.18-community
    container_name: antigravity_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/kingdom_auth_key
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - antigravity_net

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:

networks:
  antigravity_net:
    driver: bridge
